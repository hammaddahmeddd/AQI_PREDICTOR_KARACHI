name: Training Pipeline Daily

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-training-pipeline:
    name: Train and Evaluate All Models
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pandas numpy pymongo python-dotenv scikit-learn xgboost shap joblib matplotlib "dnspython>=2.0"

      - name: Validate repository structure
        run: |
          mkdir -p logs
          {
            echo "workspace: $GITHUB_WORKSPACE"
            pwd
            echo "root files:"
            ls -la
            echo "train_pipeline files:"
            ls -la train_pipeline
          } | tee logs/validation.log

          test -f run_training_pipeline.py
          test -f train_pipeline/__init__.py
          test -f train_pipeline/load_data.py
          test -f train_pipeline/train_pipeline.py

      - name: Run training pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/train_pipeline
        run: |
          set -o pipefail
          mkdir -p logs
          python -u run_training_pipeline.py 2>&1 | tee logs/training_pipeline.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: training-pipeline-failure-${{ github.run_id }}
          path: logs/*.log
          retention-days: 14
          if-no-files-found: warn